<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Rounded-corner navy background -->
  <rect width="32" height="32" rx="6" fill="#003A5D"/>
  <!-- "Predict" mark: an upward-sloping bar chart (3 bars, ascending)
       — evokes trend / forecasting without spelling anything out -->
  <rect x="7"  y="19" width="4" height="6"  rx="1" fill="#569BB4"/>
  <rect x="14" y="14" width="4" height="11" rx="1" fill="#D7944B"/>
  <rect x="21" y="9"  width="4" height="16" rx="1" fill="#C15A2D"/>
  <!-- Trend arrow tying the bars together -->
  <path d="M 6 22 L 16 15 L 25 8" stroke="#FFFFFF" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round" fill="none"
        opacity="0.85"/>
  <!-- Arrowhead at the top of the trend line -->
  <path d="M 25 8 L 22 9 M 25 8 L 25 11" stroke="#FFFFFF" stroke-width="1.5"
        stroke-linecap="round" fill="none" opacity="0.85"/>
</svg>
